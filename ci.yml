name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        flake8 Taelcore/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 Taelcore/ --count --max-line-length=127 --statistics

    - name: Test package import
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from Taelcore import *; print('Import OK')"
      continue-on-error: true

    - name: Run unit tests
      run: |
        pytest Taelcore/tests/ -v --tb=short
      continue-on-error: true  # Remove once tests are added
